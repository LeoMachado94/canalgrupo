server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /src/public;
    client_max_body_size 100M;

    location ~ \.php$ {
       fastcgi_pass   php:9000;
       fastcgi_index  index.php;
       fastcgi_read_timeout 60;
       fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
       include        fastcgi_params;
    }

    location / {
        try_files $uri /index.php$is_args$query_string;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|otf|eot|mp4|webm|ogg|mp3|wav|pdf|doc|docx|xls|xlsx|ppt|pptx|zip|tar|gz|bz2|7z|rar|txt|csv|xml)$ {
        access_log off;
        log_not_found off;
        expires max;
    }
}
